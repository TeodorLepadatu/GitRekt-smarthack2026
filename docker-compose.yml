services:
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Keep the model loaded: a cold load takes about as long as the app's 60 s LLM timeout.
      OLLAMA_KEEP_ALIVE: "-1"
      # The context the app asks for (Settings.num_ctx), so the warm-up and the app share one load.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      ENERGY_AGENT_MODEL: ${ENERGY_AGENT_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-c"]
    # Pull, then load the model once, so the first decision doesn't wait for a cold start.
    command: ["ollama pull \"$${ENERGY_AGENT_MODEL}\" && ollama run \"$${ENERGY_AGENT_MODEL}\" --think=false ok > /dev/null"]
    volumes:
      - ollama-data:/root/.ollama

  # Mock energy price API (price_api/): real ENTSO-E day-ahead + synth_market imbalance prices,
  # generated ones for days the files do not cover. The backend falls back to the CSVs if it is down.
  prices:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m price_api --host 0.0.0.0 --port 8100
    expose:
      - "8100"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # A real day: ML 1 + ML 2 forecasts and ENTSO-E prices, decided by the LLM agent.
    # ENERGY_AGENT_DATE picks the day. The default, 2026-09-28, is the presentation day: near-free
    # solar at midday (about EUR 9/MWh, 4-6 MW surplus) and an evening peak above EUR 300/MWh.
    command: python -m backend --host 0.0.0.0 --port 8000 --date ${ENERGY_AGENT_DATE:-2026-09-28}
    environment:
      OLLAMA_HOST: http://ollama:11434
      ENERGY_AGENT_MODEL: ${ENERGY_AGENT_MODEL:-qwen3.5:4b}
      ENERGY_AGENT_GOAL_MODEL: ${ENERGY_AGENT_GOAL_MODEL:-qwen3.5:4b}
      PRICE_API_URL: http://prices:8100
    depends_on:
      ollama-model:
        condition: service_completed_successfully
      prices:
        condition: service_started
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCKS: "false"
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  ollama-data:
